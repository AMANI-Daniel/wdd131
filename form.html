<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="This form demonstrate responsive form which has interactivity features and user friendly.">
    <meta name="author" content="AMANI Daniel">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="rfm">

           <div class="form-item">
                <label for="product">Product Name*</label>
                <select name="products" id="product" required>
                    <option value="" disabled>Select a Product</option>
                </select>
           </div>
            


            <div class="form-item">
                <div>Overall Rating*</div>
               <div class="radio">
                    <div class="choose">
                        <input type="radio" id="onestar" name="stars" value="choice" required>
                        <label for="onestar">&star;</label>
                    </div>

                    <div class="choose">
                        <input type="radio" id="twostars" name="stars" value="choice" required>
                        <label for="twostars">&star;&star;</label> 
                    </div>

                    <div class="choose">
                        <input type="radio" id="threestars" name="stars" value="choice" required>
                        <label for="threestars">&star;&star;&star;</label>
                    </div>

                    <div class="choose">
                        <input type="radio" id="fourstars" name="stars" value="choice" required>
                        <label for="fourstars">&star;&star;&star;&star;</label>
                    </div>

                    <div class="choose">
                        <input type="radio" id="fivestars" name="stars" value="choice" required>
                        <label for="fivestars">&star;&star;&star;&star;&star;</label>
                    </div>
               </div>
            </div>
            

            <div class="form-item">
                <label for="date">Date Of Installation*</label>
                <input type="date" id="date" name="date" required>
            </div>
            

           <div class="form-item">
                <div>Which features did you find useful in the product</div>
                <div>(Check all that apply)</div>

                <div class="check">
                    <input type="checkbox" id="design" name="design" value="yes">
                    <label for="design">Design</label>
                </div>

                <div class="check">
                    <input type="checkbox" id="durability" name="durability" value="yes">
                    <label for="durability">Durability</label>
                </div>

                <div class="check">
                    <input type="checkbox" id="use" name="use" value="yes">
                    <label for="use">Easy of Use</label>
                </div>


                <div class="check">
                    <input type="checkbox" id="performance" name="performance" value="yes">
                    <label for="performance">Performance</label>
                </div>
           </div>
            

            <div class="form-item">
                <label for="review">Written Review (Optional)</label>
                <textarea name="review" id="review" rows="5"></textarea>
            </div>
            

            <div class="form-item">
                <label for="username">User Name (Optional) </label>
                <input type="text" name="username" id="username">
            </div>
            

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <P>&copy;<span id="currentyear"></span> 💐 AMANI Daneil 💐 Rwanda</P>
        <p>Last Modification: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
